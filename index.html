<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile OCR App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better mobile experience */
        .container {
            min-height: 100vh;
        }
        /* CRITICAL FIX: Ensure the history error is hidden initially */
        #history-error {
            display: none !important;
        }
        /* ⭐ NEW CRITICAL FIX: Ensure the loading indicator is hidden initially via CSS */
        #history-loading {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased p-4">

    <div class="container mx-auto max-w-lg flex flex-col items-center justify-start py-8">
        <h1 class="text-3xl font-extrabold text-blue-800 mb-6 text-center">Capture & OCR Text</h1>

        <div class="w-full bg-white p-6 rounded-xl shadow-2xl border-t-4 border-blue-500 mb-8">
            <label for="image-input" class="block text-sm font-medium text-gray-700 mb-3">
                1. Tap below to capture an image:
            </label>
            <input
                type="file" 
                id="image-input" 
                accept="image/*" 
                capture="camera" 
                class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100 cursor-pointer transition duration-150"
            >
            <p id="file-status" class="mt-2 text-xs text-gray-500">No image selected.</p>

            <button 
                id="submit-btn" 
                disabled 
                class="w-full mt-6 py-3 px-4 bg-blue-500 text-white font-bold rounded-lg 
                        shadow-md hover:bg-blue-600 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                2. Extract Text & Save
            </button>
        </div>

        <div class="w-full bg-white p-6 rounded-xl shadow-xl border-l-4 border-gray-400 mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">OCR Result</h2>
            <div id="loading-indicator" class="hidden text-center py-4 text-blue-500 font-medium">
                Processing image and saving...
            </div>
            <pre id="result-text" class="whitespace-pre-wrap text-sm text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-200 min-h-[100px] shadow-inner">
                Extracted text will appear here after submission.
            </pre>
            <p id="save-status" class="mt-3 text-sm text-green-600 font-medium">
                ✅ Text saved successfully!
            </p>
            <p id="error-status" class="mt-3 text-sm text-red-600 font-medium">
                ❌ Submission/Processing failed.
            </p>
        </div>

        <div class="w-full bg-white p-6 rounded-xl shadow-2xl border-t-4 border-green-500">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800">Scan History</h2>
                <button 
                    id="refresh-btn" 
                    class="flex items-center space-x-1 text-sm py-1 px-3 bg-green-500 text-white font-medium rounded-full hover:bg-green-600 transition duration-300"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0113.565 1.571a1 1 0 01-1.94 0A5.002 5.002 0 005 7h2a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm12 14a1 1 0 01-1 1h-2.101a7.002 7.002 0 01-13.565-1.571a1 1 0 011.94 0A5.002 5.002 0 0015 13h-2a1 1 0 010-2h3a1 1 0 011 1v4a1 1 0 01-1 1z" clip-rule="evenodd" />
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
            
            <div id="history-loading" class="text-center py-4 text-green-500 font-medium">
                Loading records...
            </div>
            
            <div id="records-list" class="space-y-4">
                <p class="text-sm text-gray-500 text-center" id="no-records-msg">Tap 'Refresh' to load saved OCR records.</p>
            </div>
            <p id="history-error" class="mt-3 text-sm text-red-600 font-medium hidden"></p> 
        </div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const imageInput = document.getElementById('image-input');
        const submitBtn = document.getElementById('submit-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const fileStatus = document.getElementById('file-status');
        const loadingIndicator = document.getElementById('loading-indicator');
        const resultText = document.getElementById('result-text');
        const saveStatus = document.getElementById('save-status');
        const errorStatus = document.getElementById('error-status');
        
        const historyLoading = document.getElementById('history-loading');
        const recordsList = document.getElementById('records-list');
        const noRecordsMsg = document.getElementById('no-records-msg');
        const historyError = document.getElementById('history-error');

        // --- Configuration ---
        // --- Configuration ---
// ✅ FIX: Use the IP address accessible by your phone
const HOST = '10.136.90.160:8000'; 
const API_ENDPOINT = `http://${HOST}/process_image/`;
const RECORDS_ENDPOINT = `http://${HOST}/records/`;

        // Function to reset all status indicators for OCR submission
        function resetSubmissionStatus() {
            loadingIndicator.classList.add('hidden');
            saveStatus.style.display = 'none'; 
            errorStatus.style.display = 'none'; 
            resultText.textContent = 'Extracted text will appear here after submission.';
        }

        // Function to reset history status
        function resetHistoryStatus() {
            historyLoading.style.display = 'none';
            historyError.classList.add('hidden'); 
            historyError.textContent = ''; 
            noRecordsMsg.classList.remove('hidden');
            recordsList.innerHTML = '';
        }

        // --- Initial State and Event Listeners ---

        // ⭐ NEW FIX: Explicitly ensure history loading is hidden immediately.
        // The CSS rule should handle it, but this adds certainty.
        historyLoading.style.display = 'none'; 
        
        // Run reset on load (hides success/error messages)
        resetSubmissionStatus(); 

        // Enable/Disable submit button based on file selection
        imageInput.addEventListener('change', (e) => {
            resetSubmissionStatus();
            if (e.target.files.length > 0) {
                submitBtn.disabled = false;
                fileStatus.textContent = `${e.target.files[0].name} ready for upload.`;
                fileStatus.classList.remove('text-gray-500');
                fileStatus.classList.add('text-blue-700');
            } else {
                submitBtn.disabled = true;
                fileStatus.textContent = 'No image selected.';
                fileStatus.classList.remove('text-blue-700');
                fileStatus.classList.add('text-gray-500');
            }
        });

        // Handle form submission
        submitBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                resetSubmissionStatus();
                resultText.textContent = 'Please capture an image first.';
                errorStatus.style.display = 'block';
                return;
            }

            // 1. Reset all submission status indicators at the start of the process
            resetSubmissionStatus();
            loadingIndicator.classList.remove('hidden');
            submitBtn.disabled = true; 

            try {
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: formData,
                });

                let responseDetail = await response.text(); 
                
                if (!response.ok) {
                    let errorDetail = responseDetail;
                    try {
                        const errorJson = JSON.parse(responseDetail);
                        errorDetail = errorJson.message || errorDetail; 
                    } catch (e) {
                        errorDetail = `Status ${response.status}: Failed to process image. Check backend URL/logs.`;
                    }
                    throw new Error(`Server returned status ${response.status}: ${errorDetail}`);
                }

                const data = JSON.parse(responseDetail); 
                
                if (data.success) {
                    resultText.textContent = data.result || "No legible text found."; 
                    // SUCCESS: Show save status and explicitly hide error status
                    saveStatus.style.display = 'block';
                    errorStatus.style.display = 'none'; 
                    
                    fetchRecords(); 

                } else {
                    resultText.textContent = `Server Error: ${data.message || 'Unknown processing error.'}`;
                    // Server Logic Failure: Show error status
                    errorStatus.style.display = 'block';
                    saveStatus.style.display = 'none';
                }

            } catch (error) {
            // In the catch block:
errorStatus.style.display = 'block';
saveStatus.style.display = 'none';
                console.error('Fetch error:', error);
                
                let errorMsg = error.message.includes('Failed to fetch') 
                    ? `Could not connect to the backend server at http://${HOST}. Is the Django server running?`
                    : error.message;
                    
                resultText.textContent = `Communication Error: ${errorMsg}`;
                // Communication Failure: Show error status
                errorStatus.style.display = 'block';
                saveStatus.style.display = 'none';
            } finally {
                loadingIndicator.classList.add('hidden');
                imageInput.value = ''; 
                submitBtn.disabled = true; 
                fileStatus.textContent = 'Ready for a new capture.';
                fileStatus.classList.remove('text-blue-700');
                fileStatus.classList.add('text-gray-500');
            }
        });

        // --- Functionality for Scan History ---
        
        function renderRecords(records) {
            recordsList.innerHTML = ''; 
            
            if (records.length === 0) {
                noRecordsMsg.classList.remove('hidden');
                return;
            }

            noRecordsMsg.classList.add('hidden');

            records.forEach((record, index) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-50 rounded-lg shadow-sm border border-gray-200';
                
                const timestamp = new Date(record.created_at).toLocaleString(); 

                const statusColor = record.status === 'Processed' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800';

                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <p class="text-xs font-semibold text-gray-600 mb-1">
                            ${record.filename}
                        </p>
                        <span class="text-xs font-medium px-2 py-0.5 rounded-full ${statusColor}">
                            ${record.status}
                        </span>
                    </div>
                    <pre class="text-sm whitespace-pre-wrap text-gray-800 mt-1">${record.ocr_text}</pre>
                    <p class="text-xs text-gray-400 mt-1">
                        Scanned: ${timestamp}
                    </p>
                `;
                recordsList.appendChild(item);
            });
        }

        async function fetchRecords() {
            // 1. Reset everything, including hiding the error
            resetHistoryStatus(); 
            historyLoading.style.display = 'block'; // SHOW loading using style
            refreshBtn.disabled = true; 

            try {
                const response = await fetch(RECORDS_ENDPOINT);
                
                if (!response.ok) {
                    let errorDetail = await response.text();
                    
                    if (errorDetail.trim().startsWith('<!DOCTYPE html>')) {
                        errorDetail = `Status ${response.status}: Check the server URL/path for records.`;
                    }
                    
                    throw new Error(`Server returned status: ${response.status}. Detail: ${errorDetail}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    renderRecords(data.records);
                } else {
                    // 3. Server-side logic error
                    historyError.textContent = `❌ Server Error: ${data.message || 'Error fetching records from server.'}`;
                    historyError.classList.remove('hidden');
                    noRecordsMsg.classList.add('hidden'); 
                }

            } catch (error) {
                console.error('Fetch records error:', error);
                
                // 4. Connection/Fetch failure - SET AND SHOW ERROR
                historyError.textContent = `❌ Failed to load history. Is the records endpoint correct and server running?`;
                historyError.classList.remove('hidden'); 
                
                recordsList.innerHTML = '';
                noRecordsMsg.classList.add('hidden'); 
            } finally {
                historyLoading.style.display = 'none'; // HIDE loading using style
                refreshBtn.disabled = false;
            }
        }

        // Event listener for the refresh button
        refreshBtn.addEventListener('click', fetchRecords);

        // Load records on initial page load for convenience
        fetchRecords(); 
    });
</script>
</body>
</html>
